name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (sqlite_ext, CGO)
        run: CGO_ENABLED=1 go build -tags sqlite_ext ./...

      - name: Test (sqlite_ext, CGO)
        run: CGO_ENABLED=1 go test -tags sqlite_ext ./...
