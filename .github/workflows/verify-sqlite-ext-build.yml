name: verify-sqlite-ext-build

# Scratch verification workflow for the .goreleaser.yaml CGO+Zig
# cross-compile change (sqlite_ext build tag). Not part of the release
# pipeline itself — manually triggered, builds nothing that gets published.
# Safe to delete once the goreleaser change is confirmed working; kept
# committed only so workflow_dispatch has something to run against on this
# branch.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/goreleaser-sqlite-vec

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Prepare compiler caches
        run: |
          mkdir -p "$RUNNER_TEMP/zig-global-cache" "$RUNNER_TEMP/zig-local-cache" "$RUNNER_TEMP/go-tmp" "$RUNNER_TEMP/.cache"
          chmod -R 777 "$RUNNER_TEMP/zig-global-cache" "$RUNNER_TEMP/zig-local-cache" "$RUNNER_TEMP/go-tmp" "$RUNNER_TEMP/.cache"

      - name: Bisect the hang — native cc vs zig cc (no flock) vs zig cc (bounded flock), linux/amd64 only
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
          TMPDIR: ${{ runner.temp }}/go-tmp
          GOTMPDIR: ${{ runner.temp }}/go-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/.cache
        run: |
          set -x
          mkdir -p /tmp/out

          echo "### 1. native cc (no zig at all) ###"
          time timeout 180 env CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -x -tags sqlite_ext -o /tmp/out/native-linux-amd64 ./cmd/aidw
          echo "exit=$?"

          echo "### 2. zig cc directly as CC, no flock wrapper ###"
          time timeout 180 env CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC="zig cc -target x86_64-linux-gnu" \
            go build -x -tags sqlite_ext -o /tmp/out/zigdirect-linux-amd64 ./cmd/aidw
          echo "exit=$?"

          echo "### 3. zig cc via flock wrapper, BOUNDED wait (fails fast instead of hanging) ###"
          chmod +x scripts/zigcc.sh
          time timeout 180 env CGO_ENABLED=1 GOOS=linux GOARCH=amd64 ZIGCC_FLOCK_TIMEOUT=30 \
            CC="$PWD/scripts/zigcc.sh -target x86_64-linux-gnu" \
            go build -x -tags sqlite_ext -o /tmp/out/zigflock-linux-amd64 ./cmd/aidw
          echo "exit=$?"

      - name: Report which of the three bisect builds actually produced a binary
        run: |
          set -x
          ls -la /tmp/out/ || true
