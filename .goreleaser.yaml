# GoReleaser configuration for ai-dev-workflow
# Documentation: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  # CGO_ENABLED=1 + the sqlite_ext build tag pull in the CGO mattn/go-sqlite3
  # driver (cmd/aidw/internal/memory/driver_sqlite_ext.go), which is required
  # for aidw's optional vector/semantic-search extension loading. Without
  # both, the build silently falls back to the pure-Go modernc.org/sqlite
  # driver (driver_modernc.go) and semantic search is permanently
  # unavailable in the released binary — see docs/release-notes.md and the
  # "Semantic search" section of README.md. CC is set to `zig cc -target
  # <triple>` per build so each of the four release targets gets a real C
  # cross-compiler without needing per-platform sysroots on the ubuntu-latest
  # runner; Zig is already installed by .github/workflows/release.yml.
  - id: aidw-darwin-amd64
    main: ./cmd/aidw
    binary: aidw
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-macos-none
    tags:
      - sqlite_ext
    ldflags:
      - -X 'aidw/cmd/aidw/cmd.Version={{.Version}}'
    goos:
      - darwin
    goarch:
      - amd64

  - id: aidw-darwin-arm64
    main: ./cmd/aidw
    binary: aidw
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-macos-none
    tags:
      - sqlite_ext
    ldflags:
      - -X 'aidw/cmd/aidw/cmd.Version={{.Version}}'
    goos:
      - darwin
    goarch:
      - arm64

  - id: aidw-linux-amd64
    main: ./cmd/aidw
    binary: aidw
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
    tags:
      - sqlite_ext
    ldflags:
      - -X 'aidw/cmd/aidw/cmd.Version={{.Version}}'
    goos:
      - linux
    goarch:
      - amd64

  - id: aidw-linux-arm64
    main: ./cmd/aidw
    binary: aidw
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
    tags:
      - sqlite_ext
    ldflags:
      - -X 'aidw/cmd/aidw/cmd.Version={{.Version}}'
    goos:
      - linux
    goarch:
      - arm64

archives:
  - formats:
      - tar.gz
    # GoReleaser v2: archives.name_template is fine
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

# GoReleaser v2: brews instead of homebrews
brews:
  - name: aidw
    repository:
      owner: sebGilR
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/sebGilR/ai-dev-workflow"
    description: "Portable Claude + GitHub Copilot workflow kit for VS Code workspaces"
    license: "MIT"
    test: |
      system "#{bin}/aidw --version"
    install: |
      bin.install "aidw"
