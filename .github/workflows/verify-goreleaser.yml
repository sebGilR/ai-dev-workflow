name: verify-goreleaser

# Dry-runs the real .goreleaser.yaml on every change to it (or to files that
# affect what it builds), so a bad release config is caught here instead of
# by a public tag push. release.yml itself only fires on `push: tags: v*`
# with no dry-run gate, so this is the only thing that exercises the
# release build config before a real release.
on:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/verify-goreleaser.yml'
      - '.github/workflows/release.yml'
      - 'cmd/aidw/internal/memory/**'
  workflow_dispatch:
  # TEMPORARY: lets this brand-new workflow run once on this branch before
  # it exists on the base branch (pull_request-triggered workflows only run
  # using the version already on the base branch). Remove before merging.
  push:
    branches:
      - feat/goreleaser-sqlite-vec

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Prepare compiler caches
        run: |
          mkdir -p "$RUNNER_TEMP/zig-global-cache" "$RUNNER_TEMP/zig-local-cache" "$RUNNER_TEMP/go-tmp" "$RUNNER_TEMP/.cache"
          chmod -R 777 "$RUNNER_TEMP/zig-global-cache" "$RUNNER_TEMP/zig-local-cache" "$RUNNER_TEMP/go-tmp" "$RUNNER_TEMP/.cache"

      - name: goreleaser build --snapshot (real dry run of .goreleaser.yaml)
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
          TMPDIR: ${{ runner.temp }}/go-tmp
          GOTMPDIR: ${{ runner.temp }}/go-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/.cache
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean --timeout 60m

      - name: Confirm the CGO sqlite_ext driver is linked into the linux binaries (not the pure-Go fallback)
        run: |
          set -euxo pipefail
          for f in dist/aidw-linux-amd64_linux_amd64_v1/aidw dist/aidw-linux-arm64_linux_arm64_v8.0/aidw; do
            if strings "$f" | grep -q "sqlite3_with_vec"; then
              echo "OK: sqlite3_with_vec driver name present in $f"
            else
              echo "FAIL: sqlite3_with_vec driver name NOT found in $f"
              exit 1
            fi
          done

      - name: Run the native linux/amd64 binary end-to-end
        run: dist/aidw-linux-amd64_linux_amd64_v1/aidw --version
