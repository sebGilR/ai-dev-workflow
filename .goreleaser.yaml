# GoReleaser configuration for ai-dev-workflow
# Documentation: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  # CGO_ENABLED=1 + the sqlite_ext build tag pull in the CGO mattn/go-sqlite3
  # driver (cmd/aidw/internal/memory/driver_sqlite_ext.go), which is required
  # for aidw's optional vector/semantic-search extension loading. Without
  # both, the build silently falls back to the pure-Go modernc.org/sqlite
  # driver (driver_modernc.go) and semantic search is permanently
  # unavailable in the released binary — see the "Semantic search" section
  # of README.md.
  #
  # Linux only for now: CC=zig cc -target <triple> cross-compiles cleanly
  # from the ubuntu-latest runner (Zig is already installed by
  # .github/workflows/release.yml) — verified directly and via a real
  # `goreleaser build --snapshot` dry run.
  #
  # Darwin is intentionally still CGO_ENABLED=0 (pure-Go driver, no vector
  # search in the Homebrew binary): zig cc's macOS cross-target fails CGO
  # compilation with "error: unable to create compilation: AccessDenied",
  # reproduced consistently (solo, sequential, and inside goreleaser's
  # parallel build) — a real Zig 0.13 limitation, not a flakiness/ordering
  # issue. Fixing it properly means building darwin natively (e.g. on a
  # macos-latest runner) instead of cross-compiling with zig; that's a
  # separate, larger change to the release pipeline. Until then, macOS users
  # who want semantic search should build locally with `make build` (see
  # README.md), which already uses native CGO + -tags sqlite_ext.
  - id: aidw-darwin-amd64
    main: ./cmd/aidw
    binary: aidw
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X 'aidw/cmd/aidw/cmd.Version={{.Version}}'
    goos:
      - darwin
    goarch:
      - amd64

  - id: aidw-darwin-arm64
    main: ./cmd/aidw
    binary: aidw
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X 'aidw/cmd/aidw/cmd.Version={{.Version}}'
    goos:
      - darwin
    goarch:
      - arm64

  - id: aidw-linux-amd64
    main: ./cmd/aidw
    binary: aidw
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
    tags:
      - sqlite_ext
    ldflags:
      - -X 'aidw/cmd/aidw/cmd.Version={{.Version}}'
    goos:
      - linux
    goarch:
      - amd64

  - id: aidw-linux-arm64
    main: ./cmd/aidw
    binary: aidw
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
    tags:
      - sqlite_ext
    ldflags:
      - -X 'aidw/cmd/aidw/cmd.Version={{.Version}}'
    goos:
      - linux
    goarch:
      - arm64

archives:
  - formats:
      - tar.gz
    # GoReleaser v2: archives.name_template is fine
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

# GoReleaser v2: brews instead of homebrews
brews:
  - name: aidw
    repository:
      owner: sebGilR
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/sebGilR/ai-dev-workflow"
    description: "Portable Claude + GitHub Copilot workflow kit for VS Code workspaces"
    license: "MIT"
    test: |
      system "#{bin}/aidw --version"
    install: |
      bin.install "aidw"
